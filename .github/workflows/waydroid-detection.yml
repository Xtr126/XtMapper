name: Waydroid detection CI

# Two layers of testing:
#  1. Hermetic unit tests (always): the fingerprint decision rule against
#     verbatim + pattern stock fingerprints for all 4 architectures and
#     Android 11-17. No container needed.
#  2. Real Waydroid boot (workflow_dispatch "boot-waydroid", or any runner
#     where binder exists): boots an actual Waydroid container headless and
#     runs the app's detection logic inside it via app_process.
#     shortcut: hosted GitHub runners have no binder/ashmem (verified by the
#     probe), so layer 2 skips there by design; enable it on a self-hosted
#     runner with binder_linux loaded. Boot failures are reported as
#     warnings, never as test failures.

on:
  push:
    branches: [ ci-waydroid-detection ]
  pull_request:
    branches: [ ci-waydroid-detection ]
  workflow_dispatch:
    inputs:
      boot-waydroid:
        description: 'Attempt to boot a real Waydroid container and run detection inside it (needs binder; skips on hosted runners)'
        type: boolean
        default: false

jobs:
  detect-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests (incl. Environment fingerprint rule)
        run: ./gradlew :app:testDebugUnitTest --rerun-tasks --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  probe-kernel:
    runs-on: ubuntu-latest
    outputs:
      binder: ${{ steps.probe.outputs.binder }}
    steps:
      - name: Probe runner kernel for Waydroid feasibility
        id: probe
        run: |
          echo "=== Waydroid kernel feasibility probe (informational only) ==="
          echo "kernel: $(uname -r) ($(uname -m))"
          if grep -q binder /proc/filesystems; then
            echo "binder support: yes"; echo "binder=yes" >> "$GITHUB_OUTPUT"
          else
            echo "binder support: NO (Waydroid/redroid cannot run here)"
            # Best effort: the module may exist in the kernel tree.
            sudo modprobe binder_linux 2>/dev/null || true
            if grep -q binder /proc/filesystems; then
              echo "binder support: yes (loaded module)"; echo "binder=yes" >> "$GITHUB_OUTPUT"
            else
              echo "binder=no" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo -n "ashmem support: ";  grep -q ashmem /proc/misc 2>/dev/null && echo "yes" || echo "no"
          echo -n "/dev/kvm present: "; test -e /dev/kvm && echo "yes" || echo "no"
          echo "Full Waydroid boot needs binder + systemd + weston + ~2GB image."

  waydroid-boot:
    needs: probe-kernel
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.boot-waydroid) ||
        needs.probe-kernel.outputs.binder == 'yes'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure binder is available
        run: |
          if ! grep -q binder /proc/filesystems; then
            sudo modprobe binder_linux || true
          fi
          if ! grep -q binder /proc/filesystems; then
            echo "::warning::binder unavailable on this runner (hosted runners lack it) — skipping real Waydroid boot. Use a self-hosted runner with binder_linux."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Install Waydroid
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q curl python3-venv weston
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://repo.waydro.id/waydroid.gpg | sudo tee /etc/apt/keyrings/waydroid.gpg >/dev/null
          echo "signed-by=/etc/apt/keyrings/waydroid.gpg" | sudo tee /etc/apt/sources.list.d/waydroid.list >/dev/null
          curl -fsSL https://repo.waydro.id/ | sudo tee -a /etc/apt/sources.list.d/waydroid.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q waydroid

      - name: Boot headless Waydroid
        if: env.SKIP != '1'
        run: |
          sudo mkdir -p /var/lib/waydroid
          sudo waydroid init -s https://ota.waydro.id/system/lineage/waydroid_x86_64 -v https://ota.waydro.id/vendor/waydroid_x86_64 || \
            sudo waydroid init
          sudo systemctl start waydroid-container 2>/dev/null || \
            sudo /usr/lib/waydroid/waydroid-container &

          # Headless compositor for the Android session.
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
          mkdir -p "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-1 \
            --idle-time=0 --width=720 --height=1280 >/tmp/weston.log 2>&1 &
          sleep 3
          export WAYLAND_DISPLAY=wayland-1

          sudo waydroid session start >/tmp/waydroid-session.log 2>&1 &
          for i in $(seq 1 24); do
            if sudo waydroid status 2>/dev/null | grep -q "Running"; then
              echo "Waydroid running after ${i}0s"; break
            fi
            sleep 10
          done
          sudo waydroid status || true

      - name: Validate detection inside real Waydroid
        if: env.SKIP != '1'
        run: |
          fail=0

          fp=$(sudo waydroid shell getprop ro.build.fingerprint 2>/dev/null || true)
          dev=$(sudo waydroid shell getprop ro.product.device 2>/dev/null || true)
          echo "fingerprint=$fp"
          echo "device=$dev"
          case "$fp" in *waydroid*) echo "stock fingerprint contains waydroid: OK";; *) echo "::error::expected 'waydroid' in stock fingerprint"; fail=1;; esac
          case "$dev" in waydroid_*) echo "stock device name $dev: OK";; *) echo "::error::expected waydroid_* device, got '$dev'"; fail=1;; esac

          # Run the app's real decision rule inside the booted container.
          ./gradlew :app:assembleDebug -q
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          DEX=$(unzip -p "$APK" classes.dex | base64 -w0)
          cat > /tmp/DetectWaydroid.java <<JAVA
          import android.os.Build;
          public class DetectWaydroid {
              public static void main(String[] a) {
                  boolean det = Build.FINGERPRINT.toLowerCase(java.util.Locale.ROOT).contains("waydroid")
                      || Build.DEVICE.toLowerCase(java.util.Locale.ROOT).startsWith("waydroid");
                  System.out.println("DETECTION_RESULT fp=" + Build.FINGERPRINT + " device=" + Build.DEVICE + " isWaydroid=" + det);
                  System.exit(det ? 0 : 42);
              }
          }
          JAVA
          if adb_connect=$(sudo waydroid shell echo connected 2>/dev/null); then
            result=$(sudo waydroid shell "export CLASSPATH=/data/local/tmp/classes.dex; echo '$DEX' | base64 -d > /data/local/tmp/classes.dex; app_process / DetectWaydroid" 2>&1 | grep DETECTION_RESULT || true)
            echo "$result"
            case "$result" in *isWaydroid=true*) echo "app logic detected Waydroid: OK";; *) echo "::error::app logic did not detect Waydroid"; fail=1;; esac
          else
            echo "::warning::waydroid shell unavailable; app_process check skipped (property checks above still applied)"
          fi
          exit $fail

      - name: Diagnostics
        if: always()
        run: |
          echo "=== binder ==="; grep binder /proc/filesystems || echo "no binderfs"
          ls -l /dev/binderfs 2>/dev/null || echo "no /dev/binderfs"
          echo "=== waydroid ==="; sudo waydroid status 2>&1 || true
          echo "=== weston ==="; cat /tmp/weston.log 2>/dev/null | tail -20 || true
          echo "=== session ==="; cat /tmp/waydroid-session.log 2>/dev/null | tail -20 || true
          sudo journalctl -u waydroid-container --no-pager 2>/dev/null | tail -30 || true

      - name: Upload Waydroid logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waydroid-logs
          path: /var/lib/waydroid/data/waydroid.log
          if-no-files-found: ignore
