name: PR Verification

on:
  push:
    branches:
      - merge/upstream-dev-updates
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM unit tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: premex-ab/setup-android-cli@35c853708c8a6981651bb0060a17e01fac0143b1 # v1.1.0
        with:
          packages: |
            platforms/android-37
            build-tools/37.0.0
            ndk/28.0.13004108
            platform-tools
          no-metrics: 'true'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM unit tests and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xtmapper-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
