name: PR Verification

on:
  push:
    branches:
      - merge/upstream-dev-updates
      - fix/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android build and host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Host-side C++ lifecycle/scanner tests compile the production sources directly.
      # Runs before the JDK/SDK setup so a native regression fails fast.
      - name: Run host C++ tests
        run: |
          cmake -S app/src/hostTest/cpp -B build/hostTest -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/hostTest --parallel
          ctest --test-dir build/hostTest --output-on-failure

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;30.0.16248370'

      - name: Run host Native diagnostics tests
        run: |
          cmake -S app/src/hostTest/nativeDiagnostics -B build/hostNativeDiagnostics -DCMAKE_BUILD_TYPE=Debug \
            -DNDK_JNI_INCLUDE_DIR="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          cmake --build build/hostNativeDiagnostics --parallel
          ctest --test-dir build/hostNativeDiagnostics --output-on-failure --timeout 10

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xtmapper-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xtmapper-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
