plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Create a variable called keystorePropertiesFile, and initialize it to your
// keystore.properties file, in the rootProject folder.
def keystorePropertiesFile = rootProject.file("keystore.properties")

// Initialize a new Properties() object called keystoreProperties.
def keystoreProperties = new Properties()

// Load your keystore.properties file into the keystoreProperties object.
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace 'xtr.keymapper'
    compileSdk 35

    defaultConfig {
        applicationId "xtr.keymapper"
        minSdk 28
        targetSdk 34
        versionCode 21
        versionName '2.4.1'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern ''
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true	

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            resValue("string", "app_name", "XtMapper (Debug)")
        }

    }

    externalNativeBuild {
        ndkBuild {
            path 'Android.mk'
        }
    }

    applicationVariants.configureEach {
        it.outputs.every {
            it.outputFileName = "XtMapper-${it.name}-v${defaultConfig.versionName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        aidl true
        buildConfig true
        compose true
    }
    packagingOptions.jniLibs.useLegacyPackaging true

    ndkVersion '28.0.13004108'
    
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation "com.github.topjohnwu.libsu:core:5.3.0"
    implementation "com.github.topjohnwu.libsu:service:5.3.0"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"

    def composeBom = platform('androidx.compose:compose-bom:2025.06.00')
    implementation composeBom

    // Optional - Integration with activities
    implementation 'androidx.activity:activity-compose:1.10.1'

    // Material Design 3
    implementation 'androidx.compose.material3:material3'

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    compileOnly project(path: ':app:hidden-api')

}
